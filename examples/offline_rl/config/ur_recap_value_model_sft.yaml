# UR round 1: image/text value supervision; 90/10 split by episode, seed 42.
# Usage: bash examples/offline_rl/advantage_labeling/recap/run_value_sft.sh ur_recap_value_model_sft
defaults:
  - model/recap_value_model@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-3

runner:
  task_type: sft
  logger:
    log_path: logs/value_sft
    project_name: rlinf
    experiment_name: ur_recap_value_round_001
    logger_backends:
      - tensorboard
  max_epochs: -1
  max_steps: 20000
  val_check_interval: 500
  save_interval: 4000
  resume_dir: null

data:
  tag: ur_round_001
  train_data_paths:
    - dataset_path: /home/suchenyu/.cache/huggingface/lerobot/scylearning/insert_black_rack_into_blue_slot_20260916_v01
      type: sft
      weight: 1.0
      episode_seed: 42
    - dataset_path: /home/suchenyu/RLinf-recap/logs/ur_recap_rollout/round_001/20261109-190405-901088
      type: rollout
      weight: 1.0
      episode_seed: 42
  eval_data_paths:
    - dataset_path: /home/suchenyu/.cache/huggingface/lerobot/scylearning/insert_black_rack_into_blue_slot_20260916_v01
      name: sft
      episode_seed: 42
    - dataset_path: /home/suchenyu/RLinf-recap/logs/ur_recap_rollout/round_001/20261109-190405-901088
      name: rollout
      episode_seed: 42
  train_num_workers: 8
  eval_num_workers: 4
  prefetch_factor: 4
  persistent_workers: false
  pin_memory: false
  gamma: 1.0
  action_horizon: 1
  normalize_to_minus_one_zero: true
  action_dim: 7
  robot_type: ur5e
  model_type: pi05
  balance_weights: true
  seed: 42
  validation_fraction: 0.1

algorithm:
  adv_type: gae

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 256
  seed: 0
  model:
    precision: bf16
    siglip_path: /home/suchenyu/RLinf-recap/recap-setup/outputs/siglip2-so400m-patch14-224
    gemma3_path: /home/suchenyu/RLinf-recap/recap-setup/outputs/gemma-3-270m
    tokenizer_path: /home/suchenyu/RLinf-recap/recap-setup/outputs/gemma-3-270m
    freeze_vlm: false
    action_dim: 7
    action_horizon: 1
  optim:
    lr: 5.0e-05
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    lr_scheduler: constant
    lr_warmup_steps: 500
    total_training_steps: 20000
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
